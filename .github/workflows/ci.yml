name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway, notify-eval and Hermes plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gateway tests
        run: node --test server/gateway/test/
      - name: Gateway config examples are current
        run: node server/gateway/tools/config-examples.mjs --check
      - name: Notification classifier eval tests
        run: node --test server/notify-eval/test/
      - name: Hermes glasses-notify plugin tests
        run: python -m unittest discover -s server/hermes-plugins/glasses-notify/tests
      - name: Web HUD tests
        run: |
          node hud/test_hud.cjs
          python -m unittest discover -s hud -p test_server.py
      - name: Configuration reference matches the gateway schema
        run: node tools/docs/configuration.mjs --check
      - name: Documentation links resolve
        run: node tools/docs/check-links.mjs

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, golden renders and debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
          retention-days: 14
